650}.setting-label output{color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent);margin:13px 0 3px;cursor:pointer}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.setting-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13px}.switch{appearance:none;width:40px;height:23px;border-radius:20px;background:#425062;margin:0;position:relative;cursor:pointer;flex:none}.switch:before{content:'';width:17px;height:17px;border-radius:50%;background:#e5ebee;position:absolute;top:3px;left:3px;transition:transform .15s}.switch:checked{background:#4cae9a}.switch:checked:before{transform:translateX(17px)}.hint{font-size:11px;color:#8494a7;text-align:center;line-height:1.65;margin:14px 0 0}.overlay{position:absolute;inset:0;z-index:999;display:grid;place-items:center;pointer-events:none}.overlay[hidden]{display:none}.overlay>div{padding:22px 30px;border-radius:18px;background:#101720eF;border:1px solid #556675;text-align:center;box-shadow:0 12px 50px #0007}.overlay strong{font-size:24px}.overlay p{color:var(--muted);font-size:13px;margin:7px 0 0}@media(min-width:650px){main{padding-top:30px}}@media(max-height:760px) and (min-width:360px){main{padding-top:14px}.board{margin-top:10px;margin-bottom:6px}header{margin-bottom:12px}}@media(prefers-reduced-motion:reduce){.tile.spawn,.tile.pop{animation:none}}

main{width:min(100%,620px)}.board{container-type:inline-size;aspect-ratio:var(--board-ratio,1)}.cell,.tile{width:var(--cell-w);height:var(--cell-h);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}.board.square .cell,.board.square .tile{clip-path:none;border-radius:var(--tile-radius,8px)}.board.square .cell:after{border-radius:inherit}.tile{font-size:var(--tile-font);font-size:calc(var(--font-factor)*1cqw);letter-spacing:-.045em}.tile.long{font-size:calc(var(--font-factor)*.75cqw)}.tile.xlong{font-size:calc(var(--font-factor)*.60cqw)}.board .tile{font-size:calc(var(--font-factor)*var(--digit-scale,1)*1cqw)}.board-config{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:11px;font-weight:650}.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#1a2430;color:var(--ink);padding:0 9px;font:inherit;font-size:14px;outline-color:var(--accent)}.settings .setting-row{gap:10px}.view-button{width:100%;margin-top:9px}.view-button svg{width:18px;height:18px}.exit-view{display:none}.viewing main{max-width:none;width:100%;height:100dvh;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.viewing header,.viewing .board-config,.viewing .scores,.viewing .board-info,.viewing .controls,.viewing .settings,.viewing .hint,.viewing .view-button{display:none}.viewing .board{width:min(100%,calc((100dvh - 46px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*var(--board-ratio)));max-width:none;margin:0;flex:none}.viewing .exit-view{display:block;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;border:1px solid #465362;background:#16212bd9;border-radius:30px;padding:9px 13px;z-index:1000}.viewing .overlay>div{padding:14px 18px}.viewing .overlay strong{font-size:18px}.wake-note{font-size:10px;line-height:1.4;color:var(--muted);margin:5px 0 0}.viewing .board{touch-action:none}

<body><main>
<header><div><div class="eyebrow">AUTONOMOUS PUZZLE</div><h1><b id="shapeTitle">HEX</b><span>/</span>2048</h1></div><div class="status" id="status"><i class="dot"></i><span id="statusText">AUTO PLAY</span></div></header>
<section class="board-config"><label class="field" for="shape">盤面の形<select id="shape"><option value="hex">六角形</option><option value="square">正方形</option></select></label><label class="field" for="size">盤面サイズ<select id="size"></select></label></section><section class="scores" aria-label="成績"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST SCORE</small><strong id="best">0</strong></div><div class="stat"><small>MAX TILE</small><strong id="max">2</strong></div></section>
<div class="board" id="board" aria-label="六角形の19マスの盤面"><div id="overlay" class="overlay" hidden><div><strong>GAME OVER</strong><p id="overText">新しいゲームを開始できます</p></div></div></div>
<div class="board-info"><span><span class="direction" id="arrow">–</span><span id="moveName">思考中</span></span><span><span id="turn">0</span> 手 / <span id="game">1</span> ゲーム</span></div>
<div class="controls"><button class="btn primary" id="play" aria-label="自動プレイを一時停止"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>一時停止</span></button><button class="btn" id="step" title="1手進める" aria-label="1手進める"><svg viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></svg></button><button class="btn" id="reset" title="新しいゲーム" aria-label="新しいゲーム"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button></div>
<section class="settings"><label class="setting-label" for="speed"><span>プレイ速度</span><output id="speedText">標準 · 0.65秒/手</output></label><input id="speed" type="range" min="0" max="5" step="1" value="2"><div class="range-labels"><span>ゆっくり</span><span>高速</span></div><label class="setting-row" for="repeat"><span>ゲーム終了後に自動で再開</span><input class="switch" type="checkbox" id="repeat" checked></label><label class="setting-row" for="wake"><span>画面を常時点灯</span><input class="switch" type="checkbox" id="wake"></label><p class="wake-note" id="wakeNote">対応ブラウザで画面のスリープを防止します。</p></section>
<button class="btn view-button" id="view"><svg viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg>鑑賞モード</button><button class="exit-view" id="exitView">鑑賞を終了</button>
<p class="hint">一時停止中はスワイプで操作できます。<br><span id="boardHint"></span> / AIによる先読みで自動プレイ</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let shape='hex',size=3,dirs=[],arrows=[],names=[],coords=[],index,lines=[],edges=[],corners=[],weights=[],count=19,opposite=3;
function neighbor(i,d){const [q,r]=coords[i],[a,b]=dirs[d];return index.get(`${q+a},${r+b}`)??-1}
function configure(kind,n){shape=kind;size=n;const hex=kind==='hex';const radius=n-1;coords=[];
if(hex){dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];arrows=['→','↘','↙','←','↖','↗'];names=['右','右下','左下','左','左上','右上'];opposite=3;for(let r=-radius;r<=radius;r++)for(let q=-radius;q<=radius;q++)if(Math.abs(q+r)<=radius)coords.push([q,r]);}
else{dirs=[[1,0],[0,1],[-1,0],[0,-1]];arrows=['→','↓','←','↑'];names=['右','下','左','上'];opposite=2;for(let r=0;r<n;r++)for(let q=0;q<n;q++)coords.push([q,r]);}
count=coords.length;index=new Map(coords.map((p,i)=>[p.join(','),i]));lines=dirs.map((_,d)=>coords.flatMap((p,i)=>{if(neighbor(i,d)!==-1)return [];const line=[];for(let j=i;j!==-1;j=neighbor(j,(d+opposite)%dirs.length))line.push(j);return [line]}));edges=[];for(let i=0;i<count;i++)for(let d=0;d<opposite;d++){const j=neighbor(i,d);if(j>=0)edges.push([i,j])}
corners=coords.map(([q,r],i)=>({q,r,i})).filter(({q,r})=>hex?[q,r,-q-r].filter(x=>Math.abs(x)===radius).length===2:(q===0||q===radius)&&(r===0||r===radius)).map(x=>x.i);
const dist=(a,b)=>{const q=coords[a][0]-coords[b][0],r=coords[a][1]-coords[b][1];return hex?Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r)):Math.abs(q)+Math.abs(r)};weights=corners.map(c=>coords.map((_,i)=>4*(1-dist(c,i)/(2*radius))));
}
// Tiles are represented by their base-2 exponent, 0 denotes an empty cell.
function move(b,d,trace=false){const out=Array(count).fill(0), paths=trace?[]:null;let gain=0,changed=false;for(const line of lines[d]){const items=line.filter(i=>b[i]);let w=0;for(let k=0;k<items.length;k++){const a=items[k],dest=line[w++];let v=b[a];if(k+1<items.length&&v===b[items[k+1]]){const c=items[++k];v++;gain+=2**v;changed=true;if(trace)paths.push({from:a,to:dest,merge:true},{from:c,to:dest,merge:true})}else{if(a!==dest)changed=true;if(trace)paths.push({from:a,to:dest,merge:false})}out[dest]=v}}return changed?{out,gain,paths}:null}
function evaluate(b){let free=0,max=0,smooth=0,pairs=0,anch=-Infinity;for(const v of b){if(!v)free++;if(v>max)max=v}for(const [i,j] of edges){const a=b[i],c=b[j];if(a&&c){smooth+=Math.abs(a-c);if(a===c)pairs+=1+0.08*a}}
for(let k=0;k<corners.length;k++){let s=0;const w=weights[k];for(let i=0;i<count;i++)s+=w[i]*b[i]*b[i]*.028;s+=b[corners[k]]===max?max*.85:0;anch=Math.max(anch,s)}
return free*3.7+max*1.35+anch+pairs*.8-smooth*.29;}
function bestAfterSpawn(b){let best=-Infinity;for(let d=0;d<dirs.length;d++){const m=move(b,d);if(m)best=Math.max(best,evaluate(m.out)+Math.log2(1+m.gain)*.16)}return best===-Infinity?evaluate(b)-160:best}
function chance(b){const free=[];for(let i=0;i<count;i++)if(!b[i])free.push(i);if(!free.length)return bestAfterSpawn(b);// Full enumeration on small boards; bounded evenly distributed sampling on large boards.
const cap=count<=25?free.length:Math.min(free.length,count<=49?12:8);const sample=Array.from({length:cap},(_,k)=>free[Math.floor((k+.5)*free.length/cap)]);let sum=0;for(const i of sample){b[i]=1;sum+=.9*bestAfterSpawn(b);b[i]=2;sum+=.1*bestAfterSpawn(b);b[i]=0}return sum/sample.length}
function choose(b){let dBest=-1,sBest=-Infinity;for(let d=0;d<dirs.length;d++){const m=move(b,d);if(!m)continue;const s=chance(m.out)+Math.log2(1+m.gain)*.16;if(s>sBest){sBest=s;dBest=d}}return dBest}
function spawn(b){const free=[];for(let i=0;i<count;i++)if(!b[i])free.push(i);if(!free.length)return -1;const i=free[Math.floor(Math.random()*free.length)];b[i]=Math.random()<.9?1:2;return i}
const colors=[null,['#b8c6d4','#172630'],['#d6d0ae','#302c1b'],['#e6b279','#352314'],['#ea916e','#351b19'],['#e67472','#fff'],['#c95c89','#fff'],['#a16cce','#fff'],['#797ce4','#fff'],['#568cd5','#fff'],['#45b1b1','#102d30'],['#82e2c5','#12382e'],['#e5d477','#332900'],['#f1a64b','#332000'],['#ffde91','#332000']];
function pos(el,i){const [q,r]=coords[i];if(shape==='hex'){const R=size-1,W=Math.sqrt(3)*(2*R+1),H=3*R+2;el.style.left=`${50+100*Math.sqrt(3)*(q+r/2)/W}%`;el.style.top=`${50+150*r/H}%`;}else{el.style.left=`${100*(q+.5)/size}%`;el.style.top=`${100*(r+.5)/size}%`;}}
const board=$('board');
function rebuild(){board.querySelectorAll('.cell,.tile').forEach(el=>el.remove());const hex=shape==='hex',R=size-1,W=hex?Math.sqrt(3)*(2*R+1):size,H=hex?3*R+2:size;board.classList.toggle('square',!hex);board.style.setProperty('--board-ratio',W/H);board.style.setProperty('--cell-w',`${(hex?Math.sqrt(3)*.94:.94)/W*100}%`);board.style.setProperty('--cell-h',`${(hex?2*.94:.94)/H*100}%`);board.style.setProperty('--font-factor',`${(hex?1.0:.58)*100/W}`);board.style.setProperty('--tile-radius',`${Math.max(3,12-size)}px`);board.setAttribute('aria-label',`${hex?'六角形':'正方形'}の${count}マスの盤面`);$('shapeTitle').textContent=hex?'HEX':'SQUARE';$('boardHint').textContent=`${dirs.length}方向・${count}マス`;for(let i=0;i<count;i++){const el=document.createElement('div');el.className='cell';pos(el,i);board.append(el)}}
function makeTile(i,v,cls=''){const el=document.createElement('div');el.className='tile '+cls;const text=String(2**v);el.textContent=text;el.style.setProperty('--digit-scale',Math.min(1,2.65/text.length));if(text.length>=5)el.classList.add('long');if(text.length>=7)el.classList.add('xlong');const [bg,fg]=v<colors.length?colors[v]:[`hsl(${(v*47)%360} 70% 70%)`,'#172630'];el.style.background=bg;el.style.color=fg;pos(el,i);board.append(el);return el}
function load(key,def){try{return JSON.parse(localStorage.getItem('hex2048.'+key))??def}catch{return def}}
function save(key,val){try{localStorage.setItem('hex2048.'+key,JSON.stringify(val))}catch{}}
const delays=[1500,1000,650,350,180,65];const speedNames=['ゆっくり','ややゆっくり','標準','速い','かなり速い','最速'];
let b=[],tiles=[],score=0,best=0,turn=0,game=0,running=true,busy=false,over=false,timer=null,epoch=0;
let speed=Math.max(0,Math.min(5,Number(load('speed',2))||0));$('speed').value=speed;$('repeat').checked=!!load('repeat',true);
function duration(){return Math.min(270,Math.round(delays[speed]*.57))}
function updateSpeed(){document.documentElement.style.setProperty('--motion',duration()+'ms');$('speedText').textContent=`${speedNames[speed]} · ${(delays[speed]/1000).toFixed(speed===5?3:2).replace(/0$/,'')}秒/手`}
function update(){if(score>best){best=score;save(`best.${shape}.${size}`,best)}$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('max').textContent=(2**Math.max(...b)).toLocaleString();$('turn').textContent=turn.toLocaleString();$('game').textContent=game;$('status').classList.toggle('off',!running||over);$('statusText').textContent=over?'GAME OVER':running?'AUTO PLAY':'PAUSED';$('play').setAttribute('aria-label',running?'自動プレイを一時停止':'自動プレイを再開');$('play').innerHTML=running?'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>一時停止</span>':'<svg viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></svg><span>自動プレイ</span>'}
function clearTimer(){clearTimeout(timer);timer=null}
function schedule(ms=0){clearTimer();if(!running||busy||document.hidden)return;if(over){if($('repeat').checked)timer=setTimeout(()=>newGame(),Math.max(1300,ms));return}timer=setTimeout(()=>{timer=null;tick()},ms)}
function newGame(){epoch++;clearTimer();busy=false;over=false;game++;score=turn=0;b=Array(count).fill(0);board.querySelectorAll('.tile').forEach(el=>el.remove());tiles=Array(count).fill(null);spawn(b);spawn(b);b.forEach((v,i)=>{if(v)tiles[i]=makeTile(i,v,'spawn')});$('overlay').hidden=true;$('arrow').textContent='–';$('moveName').textContent=running?'思考中':'操作待ち';update();schedule(450)}
function finishGame(){over=true;$('overlay').hidden=false;$('overText').textContent=running&&$('repeat').checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始';update();schedule()}
function tick(d){if(busy||over)return;if(d===undefined)d=choose(b);if(d<0){finishGame();return}const m=move(b,d,true);if(!m)return;clearTimer();busy=true;const token=epoch,start=performance.now(),ms=duration();$('arrow').textContent=arrows[d];$('moveName').textContent=names[d]+'へ移動';const old=tiles.slice();for(const p of m.paths){const el=old[p.from];if(p.merge)el.style.zIndex='2';pos(el,p.to)}
setTimeout(()=>{if(token!==epoch)return;const next=Array(count).fill(null),merges=new Set();for(const p of m.paths){const el=old[p.from];if(p.merge){el.remove();merges.add(p.to)}else{el.style.zIndex='';next[p.to]=el}}b=m.out;for(const i of merges)next[i]=makeTile(i,b[i],'pop');const newTile=spawn(b);if(newTile>=0)next[newTile]=makeTile(newTile,b[newTile],'spawn');tiles=next;score+=m.gain;turn++;busy=false;update();if(!dirs.some((_,k)=>move(b,k))){finishGame();return}schedule(Math.max(0,delays[speed]-(performance.now()-start)))},ms+12)}
function setRunning(v){running=v;clearTimer();update();if(over){$('overText').textContent=running&&$('repeat').checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始'}if(v)schedule(0)}
$('play').onclick=()=>{if(over&&!running){running=true;if(!$('repeat').checked){newGame();return}setRunning(true);return}setRunning(!running)};$('step').onclick=()=>{setRunning(false);if(!over)tick()};$('reset').onclick=()=>newGame();$('speed').oninput=e=>{speed=Number(e.target.value);save('speed',speed);updateSpeed();if(running&&!busy)schedule(0)};$('repeat').onchange=e=>{save('repeat',e.target.checked);if(over){$('overText').textContent=running&&e.target.checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始';schedule()}};
let gesture=null;board.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;gesture=[e.clientX,e.clientY];board.setPointerCapture(e.pointerId)});board.addEventListener('pointercancel',()=>gesture=null);board.addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture[0],dy=e.clientY-gesture[1];gesture=null;if(Math.hypot(dx,dy)<18||running||busy||over)return;let angle=Math.atan2(dy,dx);const d=(Math.round(angle/(2*Math.PI/dirs.length))+dirs.length)%dirs.length;tick(d)});
window.addEventListener('keydown',e=>{if(e.target.matches('input,button,select'))return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();setRunning(!running);return}const keys=shape==='hex'?{d:0,e:5,w:4,a:3,z:2,x:1,arrowright:0,arrowleft:3}:{d:0,s:1,a:2,w:3,arrowright:0,arrowdown:1,arrowleft:2,arrowup:3};if(k in keys&&!running&&!busy&&!over){e.preventDefault();tick(keys[k])}});
const sizes={hex:[3,4,5,6],square:[3,4,5,6,7,8]};
function options(kind,n){$('size').replaceChildren(...sizes[kind].map(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=kind==='hex'?`一辺 ${v} · ${3*v*(v-1)+1}マス`:`${v} × ${v} · ${v*v}マス`;return opt}));$('size').value=sizes[kind].includes(n)?n:kind==='hex'?3:4;}
function changeBoard(kind,n){configure(kind,n);best=Number(load(`best.${kind}.${n}`,kind==='hex'&&n===3?load('best',0):0))||0;save('shape',kind);save(`size.${kind}`,n);rebuild();game=0;newGame()}
$('shape').onchange=()=>{const kind=$('shape').value;options(kind,Number(load(`size.${kind}`,kind==='hex'?3:4)));changeBoard(kind,Number($('size').value))};$('size').onchange=()=>changeBoard($('shape').value,Number($('size').value));
$('view').onclick=()=>{document.body.classList.add('viewing');window.scrollTo(0,0);if(!running)setRunning(true);refreshWake()};$('exitView').onclick=()=>document.body.classList.remove('viewing');window.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('viewing')});
let wakeLock=null,wakePending=false;async function refreshWake(){if(!$('wake').checked||document.hidden){if(wakeLock){const old=wakeLock;wakeLock=null;try{await old.release()}catch{}}return}if(!navigator.wakeLock){$('wakeNote').textContent='この環境では常時点灯を利用できません（HTTPSが必要な場合があります）。';return}if(wakeLock||wakePending)return;wakePending=true;try{const lock=await navigator.wakeLock.request('screen');if(!$('wake').checked||document.hidden){await lock.release();return}wakeLock=lock;$('wakeNote').textContent='常時点灯が有効です。';lock.addEventListener('release',()=>{if(wakeLock===lock){wakeLock=null;$('wakeNote').textContent='常時点灯が解除されました。'}})}catch{$('wakeNote').textContent='常時点灯を有効にできませんでした。ブラウザや端末設定をご確認ください。'}finally{wakePending=false}}
$('wake').checked=!!load('wake',false);$('wake').onchange=()=>{save('wake',$('wake').checked);if(!$('wake').checked)$('wakeNote').textContent='常時点灯はオフです。';refreshWake()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimer();else{schedule(250);refreshWake()}});updateSpeed();const initial=load('shape','hex')==='square'?'square':'hex';$('shape').value=initial;options(initial,Number(load(`size.${initial}`,initial==='hex'?3:4)));changeBoard(initial,Number($('size').value));refreshWake();
