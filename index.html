<script>
'use strict';
const $=id=>document.getElementById(id);
let shape='hex',size=3,dirs=[],arrows=[],names=[],coords=[],index,lines=[],edges=[],corners=[],weights=[],count=19,opposite=3;
function neighbor(i,d){const [q,r]=coords[i],[a,b]=dirs[d];return index.get(`${q+a},${r+b}`)??-1}
function configure(kind,n){shape=kind;size=n;const hex=kind==='hex';const radius=n-1;coords=[];
if(hex){dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];arrows=['→','↘','↙','←','↖','↗'];names=['右','右下','左下','左','左上','右上'];opposite=3;for(let r=-radius;r<=radius;r++)for(let q=-radius;q<=radius;q++)if(Math.abs(q+r)<=radius)coords.push([q,r]);}
else{dirs=[[1,0],[0,1],[-1,0],[0,-1]];arrows=['→','↓','←','↑'];names=['右','下','左','上'];opposite=2;for(let r=0;r<n;r++)for(let q=0;q<n;q++)coords.push([q,r]);}
count=coords.length;index=new Map(coords.map((p,i)=>[p.join(','),i]));lines=dirs.map((_,d)=>coords.flatMap((p,i)=>{if(neighbor(i,d)!==-1)return [];const line=[];for(let j=i;j!==-1;j=neighbor(j,(d+opposite)%dirs.length))line.push(j);return [line]}));edges=[];for(let i=0;i<count;i++)for(let d=0;d<opposite;d++){const j=neighbor(i,d);if(j>=0)edges.push([i,j])}
corners=coords.map(([q,r],i)=>({q,r,i})).filter(({q,r})=>hex?[q,r,-q-r].filter(x=>Math.abs(x)===radius).length===2:(q===0||q===radius)&&(r===0||r===radius)).map(x=>x.i);
const dist=(a,b)=>{const q=coords[a][0]-coords[b][0],r=coords[a][1]-coords[b][1];return hex?Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r)):Math.abs(q)+Math.abs(r)};weights=corners.map(c=>coords.map((_,i)=>4*(1-dist(c,i)/(2*radius))));
}
// Tiles are represented by their base-2 exponent, 0 denotes an empty cell.
function move(b,d,trace=false){const out=Array(count).fill(0), paths=trace?[]:null;let gain=0,changed=false;for(const line of lines[d]){const items=line.filter(i=>b[i]);let w=0;for(let k=0;k<items.length;k++){const a=items[k],dest=line[w++];let v=b[a];if(k+1<items.length&&v===b[items[k+1]]){const c=items[++k];v++;gain+=2**v;changed=true;if(trace)paths.push({from:a,to:dest,merge:true},{from:c,to:dest,merge:true})}else{if(a!==dest)changed=true;if(trace)paths.push({from:a,to:dest,merge:false})}out[dest]=v}}return changed?{out,gain,paths}:null}
function evaluate(b){let free=0,max=0,smooth=0,pairs=0,anch=-Infinity;for(const v of b){if(!v)free++;if(v>max)max=v}for(const [i,j] of edges){const a=b[i],c=b[j];if(a&&c){smooth+=Math.abs(a-c);if(a===c)pairs+=1+0.08*a}}
for(let k=0;k<corners.length;k++){let s=0;const w=weights[k];for(let i=0;i<count;i++)s+=w[i]*b[i]*b[i]*.028;s+=b[corners[k]]===max?max*.85:0;anch=Math.max(anch,s)}
return free*3.7+max*1.35+anch+pairs*.8-smooth*.29;}
function bestAfterSpawn(b){let best=-Infinity;for(let d=0;d<dirs.length;d++){const m=move(b,d);if(m)best=Math.max(best,evaluate(m.out)+Math.log2(1+m.gain)*.16)}return best===-Infinity?evaluate(b)-160:best}
function chance(b){const free=[];for(let i=0;i<count;i++)if(!b[i])free.push(i);if(!free.length)return bestAfterSpawn(b);// Full enumeration on small boards; bounded evenly distributed sampling on large boards.
const cap=count<=25?free.length:Math.min(free.length,count<=49?12:8);const sample=Array.from({length:cap},(_,k)=>free[Math.floor((k+.5)*free.length/cap)]);let sum=0;for(const i of sample){b[i]=1;sum+=.9*bestAfterSpawn(b);b[i]=2;sum+=.1*bestAfterSpawn(b);b[i]=0}return sum/sample.length}
function choose(b){let dBest=-1,sBest=-Infinity;for(let d=0;d<dirs.length;d++){const m=move(b,d);if(!m)continue;const s=chance(m.out)+Math.log2(1+m.gain)*.16;if(s>sBest){sBest=s;dBest=d}}return dBest}
function spawn(b){const free=[];for(let i=0;i<count;i++)if(!b[i])free.push(i);if(!free.length)return -1;const i=free[Math.floor(Math.random()*free.length)];b[i]=Math.random()<.9?1:2;return i}
const colors=[null,['#b8c6d4','#172630'],['#d6d0ae','#302c1b'],['#e6b279','#352314'],['#ea916e','#351b19'],['#e67472','#fff'],['#c95c89','#fff'],['#a16cce','#fff'],['#797ce4','#fff'],['#568cd5','#fff'],['#45b1b1','#102d30'],['#82e2c5','#12382e'],['#e5d477','#332900'],['#f1a64b','#332000'],['#ffde91','#332000']];
const palettes={
 original:colors.slice(1).map(c=>c[0]),
 classic:['#eee4da','#eedcc2','#f2ad75','#eb9067','#e8785c','#cf5447','#efce75','#e6bc54','#d6a039','#bc862b','#926423','#74532a','#503b29','#37291e'],
 cyber:['#263d59','#24546b','#187589','#16b5b2','#57f1d9','#65bbff','#557ef0','#8768e5','#b45ed7','#e263bb','#ff83a4','#ffb97a','#ffe38b','#d2ff9f'],
 minimal:['#30343a','#41474e','#525a62','#667079','#7b858e','#929ca4','#aab3ba','#c2c9ce','#d5dbe0','#ebeeef','#d1dfd6','#a4b9ae','#718b7e','#4d6a5b'],
 pastel:['#e8d9ef','#d5def6','#f4ccd9','#f7d9b7','#c4e5d5','#bfd9ee','#d8c9ef','#e7b9d9','#f0bdad','#edda9d','#a9d9d0','#9dbbdc','#bb9ed5','#e5a6bf'],
 ocean:['#c5e8eb','#93d8df','#64c5d3','#3baebf','#3097b4','#287caa','#2862a5','#404eaa','#6254ae','#8575c9','#a6a7e4','#b9d6f5','#92e6d8','#e2f6dd'],
 sunset:['#fae1c2','#ffd2a1','#f9b178','#f38a66','#e96b63','#d34e69','#b8427a','#913d8b','#6e479c','#514caa','#7761c1','#b183d1','#e2a3d0','#ffcfaf']
};
const themeNotes={original:'従来の落ち着いたダークデザイン。',classic:'温かみのある紙調の背景と、穏やかな合体演出。',cyber:'発光する数字、近未来的な書体とシャープな演出。',minimal:'無駄を抑えたモノトーン調。合体時の弾みも控えめ。',pastel:'柔らかな背景と丸み、弾むような合体演出。'};
let theme=Object.hasOwn(themeNotes,load('theme','original'))?load('theme','original'):'original';
let palette=Object.hasOwn(palettes,load('palette','auto'))?load('palette','auto'):'auto';
function inkFor(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);const l=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];return (l+.05)/.05>=1.05/(l+.05)?'#080d12':'#ffffff'}
function tileColor(v){const list=palettes[palette==='auto'?theme:palette];const bg=list[(v-1)%list.length];return [bg,inkFor(bg)]}
function paintTile(el,v){const [bg,fg]=tileColor(v);el.style.setProperty('--tile-bg',bg);el.style.setProperty('--tile-fg',fg);el.dataset.exponent=String(v)}
function applyAppearance(){document.body.dataset.theme=theme;$('themeChoice').value=theme;$('paletteChoice').value=palette;$('themeNote').textContent=themeNotes[theme];const preview=$('palettePreview');preview.replaceChildren();for(const v of [1,2,4,6,8,11]){const el=document.createElement('span');el.className='palette-sample';const [bg,fg]=tileColor(v);el.style.background=bg;el.style.color=fg;el.textContent=2**v;preview.append(el)}for(const el of board.querySelectorAll('.tile'))paintTile(el,Number(el.dataset.exponent));save('theme',theme);save('palette',palette)}
function pos(el,i){const [q,r]=coords[i];if(shape==='hex'){const R=size-1,W=Math.sqrt(3)*(2*R+1),H=3*R+2;el.style.left=`${50+100*Math.sqrt(3)*(q+r/2)/W}%`;el.style.top=`${50+150*r/H}%`;}else{el.style.left=`${100*(q+.5)/size}%`;el.style.top=`${100*(r+.5)/size}%`;}}
const board=$('board');
function rebuild(){board.querySelectorAll('.cell,.tile,.fx-ring,.fx-spark').forEach(el=>el.remove());const hex=shape==='hex',R=size-1,W=hex?Math.sqrt(3)*(2*R+1):size,H=hex?3*R+2:size;board.classList.toggle('square',!hex);board.style.setProperty('--board-ratio',W/H);board.style.setProperty('--cell-w',`${(hex?Math.sqrt(3)*.94:.94)/W*100}%`);board.style.setProperty('--cell-h',`${(hex?2*.94:.94)/H*100}%`);board.style.setProperty('--font-factor',`${(hex?Math.sqrt(3)*.94:.94)*.49*100/W}`);board.style.setProperty('--tile-radius',`${Math.max(3,12-size)}px`);board.setAttribute('aria-label',`${hex?'六角形':'正方形'}の${count}マスの盤面`);$('shapeTitle').textContent=hex?'HEX':'SQUARE';$('boardHint').textContent=`${dirs.length}方向・${count}マス`;for(let i=0;i<count;i++){const el=document.createElement('div');el.className='cell';pos(el,i);board.append(el)}}
function makeTile(i,v,cls=''){const el=document.createElement('div');el.className='tile '+cls;const text=String(2**v);el.textContent=text;el.style.setProperty('--digit-scale',Math.min(1,2.30/text.length));if(text.length>=5)el.classList.add('long');if(text.length>=7)el.classList.add('xlong');paintTile(el,v);pos(el,i);board.append(el);return el}
function load(key,def){try{return JSON.parse(localStorage.getItem('hex2048.'+key))??def}catch{return def}}
function save(key,val){try{localStorage.setItem('hex2048.'+key,JSON.stringify(val))}catch{}}
const delays=[1500,1000,650,350,180,65];const speedNames=['ゆっくり','ややゆっくり','標準','速い','かなり速い','最速'];
let b=[],tiles=[],score=0,best=0,turn=0,game=0,running=true,busy=false,over=false,timer=null,epoch=0;
let recordMax=0,milestoneTimer=null;
let effects=['low','normal','high'].includes(load('effects','normal'))?load('effects','normal'):'normal';
$('effects').value=effects;document.body.dataset.effects=effects;
$('effects').onchange=e=>{effects=e.target.value;document.body.dataset.effects=effects;save('effects',effects)};
const dialog=$('settingsDialog');
$('openSettings').onclick=()=>{clearTimer();dialog.showModal()};
$('closeSettings').onclick=$('doneSettings').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
dialog.addEventListener('close',()=>{schedule(100);refreshWake()});
function clearEffects(){clearTimeout(milestoneTimer);$('milestone').hidden=true;board.querySelectorAll('.fx-ring,.fx-spark').forEach(el=>el.remove())}
function burst(i,v,major=false){if(effects==='low'||(!major&&speed>=4)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const color=tileColor(v)[0],duration=major?650:Math.min(380,delays[speed]*.75);
 const ring=document.createElement('div');ring.className='fx-ring';ring.style.setProperty('--fx-color',color);ring.style.setProperty('--fx-ring-ms',duration+'ms');pos(ring,i);board.append(ring);setTimeout(()=>ring.remove(),duration+40);
 if(major||effects==='high'){const n=major?(theme==='cyber'?14:theme==='minimal'?5:10):(theme==='cyber'?7:theme==='minimal'?3:5),dist=board.clientWidth/(shape==='hex'?2*size-1:size)*.7;for(let k=0;k<n;k++){const p=document.createElement('div'),a=k*Math.PI*2/n;p.className='fx-spark';pos(p,i);p.style.setProperty('--dx',Math.cos(a)*dist+'px');p.style.setProperty('--dy',Math.sin(a)*dist+'px');p.style.setProperty('--fx-color',color);p.style.setProperty('--fx-ring-ms',duration+'ms');board.append(p);setTimeout(()=>p.remove(),duration+40)}}
}
function announce(v,record){if(effects==='low'||v<4)return 0;const el=$('milestone');clearTimeout(milestoneTimer);el.hidden=true;void el.offsetWidth;el.classList.toggle('record',record);$('milestoneLabel').textContent=record?'NEW RECORD':'NEW MAX';$('milestoneValue').textContent=(2**v).toLocaleString();el.hidden=false;milestoneTimer=setTimeout(()=>el.hidden=true,1100);return speed>=4?Math.min(400,delays[speed]*2):effects==='high'?850:550}
function resizeFont(){const factor=Number(board.style.getPropertyValue('--font-factor'));if(factor)board.style.setProperty('--tile-font',board.clientWidth*factor/100+'px')}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resizeFont).observe(board);else window.addEventListener('resize',resizeFont);
let speed=Math.max(0,Math.min(5,Number(load('speed',2))||0));$('speed').value=speed;$('repeat').checked=!!load('repeat',true);
function duration(){return Math.min(270,Math.round(delays[speed]*.57))}
function updateSpeed(){document.documentElement.style.setProperty('--motion',duration()+'ms');document.documentElement.style.setProperty('--fx-ms',Math.min(240,Math.max(35,delays[speed]*.34))+'ms');$('speedText').textContent=`${speedNames[speed]} · ${(delays[speed]/1000).toFixed(speed===5?3:2).replace(/0$/,'')}秒/手`}
function update(){if(score>best){best=score;save(`best.${shape}.${size}`,best)}$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('max').textContent=(2**Math.max(...b)).toLocaleString();$('turn').textContent=turn.toLocaleString();$('game').textContent=game;$('status').classList.toggle('off',!running||over);$('statusText').textContent=over?'GAME OVER':running?'AUTO PLAY':'PAUSED';$('play').setAttribute('aria-label',running?'自動プレイを一時停止':'自動プレイを再開');$('play').innerHTML=running?'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>一時停止</span>':'<svg viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></svg><span>自動プレイ</span>'}
function clearTimer(){clearTimeout(timer);timer=null}
function schedule(ms=0){clearTimer();if(!running||busy||document.hidden||dialog.open)return;if(over){if($('repeat').checked)timer=setTimeout(()=>newGame(),Math.max(1300,ms));return}timer=setTimeout(()=>{timer=null;tick()},ms)}
function newGame(){epoch++;clearTimer();clearEffects();busy=false;over=false;game++;score=turn=0;b=Array(count).fill(0);board.querySelectorAll('.tile').forEach(el=>el.remove());tiles=Array(count).fill(null);spawn(b);spawn(b);b.forEach((v,i)=>{if(v)tiles[i]=makeTile(i,v,'spawn')});$('overlay').hidden=true;$('arrow').textContent='–';$('moveName').textContent=running?'思考中':'操作待ち';update();schedule(450)}
function finishGame(){over=true;$('overlay').hidden=false;$('overText').textContent=running&&$('repeat').checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始';update();schedule()}
function tick(d){if(busy||over)return;if(d===undefined)d=choose(b);if(d<0){finishGame();return}const m=move(b,d,true);if(!m)return;const previousMax=Math.max(...b);clearTimer();busy=true;const token=epoch,start=performance.now(),ms=duration();$('arrow').textContent=arrows[d];$('moveName').textContent=names[d]+'へ移動';const old=tiles.slice();for(const p of m.paths){const el=old[p.from];if(p.merge)el.style.zIndex='2';pos(el,p.to)}
setTimeout(()=>{if(token!==epoch)return;const next=Array(count).fill(null),merges=new Set();for(const p of m.paths){const el=old[p.from];if(p.merge){el.remove();merges.add(p.to)}else{el.style.zIndex='';next[p.to]=el}}b=m.out;let hold=0;const mergedMax=Math.max(...b),milestone=mergedMax>previousMax;const historic=mergedMax>recordMax;if(historic){recordMax=mergedMax;save(`max.${shape}.${size}`,recordMax)}if(milestone)hold=announce(mergedMax,historic);for(const i of merges){next[i]=makeTile(i,b[i],'pop');burst(i,b[i],milestone&&b[i]===mergedMax&&mergedMax>=4)}const newTile=spawn(b);if(newTile>=0)next[newTile]=makeTile(newTile,b[newTile],'spawn');tiles=next;score+=m.gain;turn++;busy=false;update();if(!dirs.some((_,k)=>move(b,k))){finishGame();return}schedule(Math.max(hold,delays[speed]-(performance.now()-start),0))},ms+12)}
function setRunning(v){running=v;clearTimer();update();if(over){$('overText').textContent=running&&$('repeat').checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始'}if(v)schedule(0)}
$('play').onclick=()=>{if(over&&!running){running=true;if(!$('repeat').checked){newGame();return}setRunning(true);return}setRunning(!running)};$('step').onclick=()=>{setRunning(false);if(!over)tick()};$('reset').onclick=()=>newGame();$('speed').oninput=e=>{speed=Number(e.target.value);save('speed',speed);updateSpeed();if(running&&!busy)schedule(0)};$('repeat').onchange=e=>{save('repeat',e.target.checked);if(over){$('overText').textContent=running&&e.target.checked?'まもなく新しいゲームを開始':'リセットで新しいゲームを開始';schedule()}};
let gesture=null;board.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;gesture=[e.clientX,e.clientY];board.setPointerCapture(e.pointerId)});board.addEventListener('pointercancel',()=>gesture=null);board.addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture[0],dy=e.clientY-gesture[1];gesture=null;if(Math.hypot(dx,dy)<18||running||busy||over)return;let angle=Math.atan2(dy,dx);const d=(Math.round(angle/(2*Math.PI/dirs.length))+dirs.length)%dirs.length;tick(d)});
window.addEventListener('keydown',e=>{if(dialog.open||e.target.matches('input,button,select'))return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();setRunning(!running);return}const keys=shape==='hex'?{d:0,e:5,w:4,a:3,z:2,x:1,arrowright:0,arrowleft:3}:{d:0,s:1,a:2,w:3,arrowright:0,arrowdown:1,arrowleft:2,arrowup:3};if(k in keys&&!running&&!busy&&!over){e.preventDefault();tick(keys[k])}});
const sizes={hex:[3,4,5,6],square:[3,4,5,6,7,8]};
function options(kind,n){$('size').replaceChildren(...sizes[kind].map(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=kind==='hex'?`一辺 ${v} · ${3*v*(v-1)+1}マス`:`${v} × ${v} · ${v*v}マス`;return opt}));$('size').value=sizes[kind].includes(n)?n:kind==='hex'?3:4;}
function changeBoard(kind,n){configure(kind,n);recordMax=Number(load(`max.${kind}.${n}`,0))||0;best=Number(load(`best.${kind}.${n}`,kind==='hex'&&n===3?load('best',0):0))||0;save('shape',kind);save(`size.${kind}`,n);rebuild();resizeFont();game=0;newGame()}
$('shape').onchange=()=>{const kind=$('shape').value;options(kind,Number(load(`size.${kind}`,kind==='hex'?3:4)));changeBoard(kind,Number($('size').value))};$('size').onchange=()=>changeBoard($('shape').value,Number($('size').value));
$('view').onclick=()=>{document.body.classList.add('viewing');window.scrollTo(0,0);if(!running)setRunning(true);refreshWake()};$('exitView').onclick=()=>document.body.classList.remove('viewing');window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open)document.body.classList.remove('viewing')});
let wakeLock=null,wakePending=false;async function refreshWake(){if(!$('wake').checked||document.hidden){if(wakeLock){const old=wakeLock;wakeLock=null;try{await old.release()}catch{}}return}if(!navigator.wakeLock){$('wakeNote').textContent='この環境では常時点灯を利用できません（HTTPSが必要な場合があります）。';return}if(wakeLock||wakePending)return;wakePending=true;try{const lock=await navigator.wakeLock.request('screen');if(!$('wake').checked||document.hidden){await lock.release();return}wakeLock=lock;$('wakeNote').textContent='常時点灯が有効です。';lock.addEventListener('release',()=>{if(wakeLock===lock){wakeLock=null;$('wakeNote').textContent='常時点灯が解除されました。'}})}catch{$('wakeNote').textContent='常時点灯を有効にできませんでした。ブラウザや端末設定をご確認ください。'}finally{wakePending=false}}
$('wake').checked=!!load('wake',false);$('wake').onchange=()=>{save('wake',$('wake').checked);if(!$('wake').checked)$('wakeNote').textContent='常時点灯はオフです。';refreshWake()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimer();else{schedule(250);refreshWake()}});$('themeChoice').onchange=e=>{theme=e.target.value;applyAppearance()};$('paletteChoice').onchange=e=>{palette=e.target.value;applyAppearance()};applyAppearance();updateSpeed();const initial=load('shape','hex')==='square'?'square':'hex';$('shape').value=initial;options(initial,Number(load(`size.${initial}`,initial==='hex'?3:4)));changeBoard(initial,Number($('size').value));refreshWake();
